<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Quality &amp; Training Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-dark:#063D3E;
    --teal:#00A4A6;
    --teal-light:#3FC1C2;
    --teal-mist:#E1F5F5;
    --ink:#182420;
    --ink-soft:#5C6863;
    --ink-faint:#8B958F;
    --bg:#F6F8F7;
    --card:#FFFFFF;
    --line:#E3E7E4;
    --line-strong:#CFD6D2;
    --amber:#C98A2C;
    --amber-soft:#FBF0DE;
    --slate:#6B7280;
    --slate-soft:#EEF0F2;
    --gold:#B8892B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Libre Franklin', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 28px;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,#063D3E 0%,#00898B 55%,#00A4A6 100%);
    padding:52px 0 34px;
  }
  .hero::before{
    content:"";
    position:absolute;
    top:-160px; left:-140px;
    width:420px;height:420px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.10), rgba(255,255,255,0) 70%);
  }
  .hero::after{
    content:"";
    position:absolute;
    top:-60px; left:-220px;
    width:340px;height:340px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.08);
  }
  .hero .wrap{position:relative;z-index:1;}
  .eyebrow{
    text-align:right;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:rgba(255,255,255,0.62);
    margin-bottom:14px;
  }
  .hero h1{
    font-size:38px;
    font-weight:800;
    letter-spacing:-0.015em;
    color:#fff;
    margin:0 0 6px;
    max-width:640px;
    line-height:1.15;
  }
  .hero .tagline{
    font-size:14.5px;
    font-weight:600;
    color:rgba(255,255,255,0.72);
    margin:0 0 18px;
  }
  .hero p.lede{
    font-size:15.5px;
    color:rgba(255,255,255,0.78);
    max-width:600px;
    margin:0 0 34px;
    font-weight:500;
  }
  .hero-stats{
    display:flex;
    gap:0;
    border-top:1px solid rgba(255,255,255,0.16);
    padding-top:22px;
  }
  .hstat{
    padding:0 28px;
    border-right:1px solid rgba(255,255,255,0.16);
  }
  .hstat:first-child{padding-left:0;}
  .hstat:last-child{border-right:none;}
  .hstat .num{
    font-size:26px;
    font-weight:800;
    color:#fff;
    line-height:1;
    letter-spacing:-0.01em;
  }
  .hstat .label{
    margin-top:6px;
    font-size:12.5px;
    font-weight:600;
    color:rgba(255,255,255,0.62);
  }

  /* ---------- TABS ---------- */
  .tabbar{
    background:var(--card);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:5;
  }
  .tabbar-inner{
    display:flex;
    gap:30px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabbar-inner::-webkit-scrollbar{display:none;}
  .tabbtn{
    background:none;border:none;cursor:pointer;
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    color:var(--ink-faint);
    padding:16px 0 14px;
    white-space:nowrap;
    border-bottom:2px solid transparent;
    transition:color .15s ease,border-color .15s ease;
  }
  .tabbtn.on{color:var(--ink);border-bottom-color:var(--teal);}
  .tabbtn:hover{color:var(--ink);}

  /* ---------- CONTENT ---------- */
  .content{padding:34px 0 80px;}
  .panel{display:none;}
  .panel.on{display:block;}

  .section-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:4px;
  }
  .section-head h2{
    font-size:21px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .badge-tag{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:11.5px;
    font-weight:800;
    letter-spacing:0.02em;
    color:#fff;
    background:var(--ink);
    padding:3px 9px;
    border-radius:6px;
  }
  .section-desc{
    color:var(--ink-soft);
    font-size:14px;
    margin:6px 0 26px;
    max-width:640px;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .search{flex:1;min-width:200px;}
  .search input{
    width:100%;
    font-family:inherit;
    font-size:14px;
    padding:10px 14px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:var(--card);
    color:var(--ink);
  }
  .search input:focus{outline:none;border-color:var(--teal);}
  .chip-group{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    font-family:inherit;font-size:12.5px;font-weight:600;
    padding:7px 13px;border-radius:20px;
    border:1px solid var(--line-strong);
    background:var(--card);color:var(--ink-soft);cursor:pointer;
    white-space:nowrap;
  }
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}

  /* cards */
  .card-list{display:flex;flex-direction:column;gap:12px;}
  .rcard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
  }
  .rcard.flagged{border-style:dashed;border-color:var(--amber);}
  .rcard-main{flex:1;min-width:0;}
  .rcard-title-row{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-bottom:5px;
  }
  .rcard-title{font-size:15.5px;font-weight:700;}
  .status-pill{
    font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;
  }
  .status-pill.active{background:var(--teal-mist);color:var(--teal);}
  .status-pill.hold{background:var(--amber-soft);color:var(--amber);}
  .status-pill.done{background:var(--slate-soft);color:var(--slate);}
  .status-pill.unk{background:#F2F2F2;color:var(--ink-faint);}
  .rcard-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.55;max-width:680px;}
  .rcard-meta{
    margin-top:10px;
    display:flex;gap:14px;align-items:center;
    font-size:12px;color:var(--ink-faint);font-weight:600;
  }
  .rcard-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-faint);}
  .rcard-side{
    display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0;
  }
  .openbtn{
    display:inline-flex;align-items:center;gap:6px;
    font-family:inherit;font-size:13px;font-weight:700;
    color:var(--teal);
    background:var(--teal-mist);
    border:1px solid transparent;
    padding:8px 14px;
    border-radius:20px;
    text-decoration:none;
    white-space:nowrap;
    cursor:default;
  }
  .hint{font-size:12.5px;color:var(--ink-faint);margin-top:22px;}

  /* leaderboard */
  .lb-row{
    display:grid;
    grid-template-columns:28px 150px 1fr 64px;
    align-items:center;
    gap:16px;
    padding:12px 16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
  }
  .lb-rank{font-size:13px;font-weight:800;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .lb-rank.g{color:var(--gold);}
  .lb-name{font-size:14.5px;font-weight:700;}
  .lb-bar-track{height:9px;background:var(--slate-soft);border-radius:5px;overflow:hidden;}
  .lb-bar-fill{height:100%;background:var(--teal);border-radius:5px;}
  .lb-row.top .lb-bar-fill{background:var(--gold);}
  .lb-score{text-align:right;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;}
  .lb-detail{display:none;padding:4px 16px 14px;font-size:13px;color:var(--ink-soft);gap:24px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;margin-top:-14px;margin-bottom:8px;}
  .lb-detail.open{display:flex;}
  .lb-detail .metric b{color:var(--ink);font-weight:700;}
  .lb-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:14px;}
  .sort-group{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);}
  select{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;background:var(--card);}
  .methodology{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-faint);max-width:680px;}

  @media (max-width:640px){
    .hero h1{font-size:29px;}
    .hero-stats{flex-wrap:wrap;row-gap:16px;}
    .hstat{border-right:none;padding:0 20px 0 0;}
    .rcard{flex-direction:column;}
    .rcard-side{flex-direction:row;width:100%;justify-content:flex-end;}
    .lb-row{grid-template-columns:22px 100px 1fr 46px;}
  }
</style>
</head>

function allItems(){ return TRACKER.flatMap(g => g.items.map(i => ({...i, group:g.group}))); }

function parseDate(str){
  if(!str || str==="—") return -Infinity;
  const parts = str.split("/");
  if(parts.length!==3) return -Infinity;
  const m = parseInt(parts[0],10), d = parseInt(parts[1],10), y = parseInt(parts[2],10);
  if(isNaN(m)||isNaN(d)||isNaN(y)) return -Infinity;
  return new Date(y,m-1,d).getTime();
}

function sortedItems(items){
  return [...items].sort((a,b)=> parseDate(b.date) - parseDate(a.date));
}

function renderHeroStats(){
  const items = allItems();
  const counts = {active:0,hold:0,done:0,unk:0};
  items.forEach(i => counts[i.status]++);
  document.getElementById("heroStats").innerHTML = `
    <div class="hstat"><div class="num">${items.length}</div><div class="label">Files tracked</div></div>
    <div class="hstat"><div class="num">${counts.active}</div><div class="label">Active / ongoing</div></div>
    <div class="hstat"><div class="num">${counts.hold}</div><div class="label">On hold</div></div>
    <div class="hstat"><div class="num">${TRACKER.length}</div><div class="label">Workstreams</div></div>
    <div class="hstat"><div class="num">16</div><div class="label">Agents scored (Q2)</div></div>
  `;
}

  const tabs = TRACKER.map(g => `<button class="tabbtn ${activeTab===g.key?'on':''}" data-tab="${g.key}">${g.group}</button>`).join("");

    btn.addEventListener("click", ()=>{
      activeTab = btn.dataset.tab;
      renderTabs();
      renderPanels();
    });
  });
}

  const st = filterState[g.key];
  const items = sortedItems(g.items).filter(i=>{
    const statusOk = st.status==="all" || i.status===st.status;
    const q = st.search.trim().toLowerCase();
    const searchOk = !q || i.name.toLowerCase().includes(q) || i.notes.toLowerCase().includes(q);
    return statusOk && searchOk;
  });
  const counts = {all:g.items.length,active:0,hold:0,done:0};
  g.items.forEach(i=>{ if(counts[i.status]!==undefined) counts[i.status]++; });
  const chipDefs = [["all","All"],["active","Active"],["hold","On hold"],["done","Completed"]];

  host.innerHTML = `
    <div class="section-head"><span class="badge-tag">${g.tag}</span><h2>${g.group}</h2></div>
    <p class="section-desc">${g.desc}</p>
    <div class="controls">
      <div class="search"><input type="text" id="searchInput" placeholder="Search this workstream…" value="${st.search}"></div>
      <div class="chip-group" id="chipGroup">
        ${chipDefs.map(([k,l])=>`<button class="chip ${st.status===k?'on':''}" data-status="${k}">${l} · ${counts[k]}</button>`).join("")}
      </div>
    </div>
    <div class="card-list">
      ${items.map(i => `
        <div class="rcard ${i.flag?'flagged':''}">
          <div class="rcard-main">
            <div class="rcard-title-row">
              <span class="rcard-title">${i.name}</span>
              <span class="status-pill ${i.status}">${STATUS_LABEL[i.status]}</span>
            </div>
            <div class="rcard-desc">${i.notes}</div>
            <div class="rcard-meta"><span>${i.type}</span><span class="dot"></span><span>Updated ${i.date}</span></div>
          </div>
          <div class="rcard-side">
            <span class="openbtn">Open ↗</span>
          </div>
        </div>
      `).join("") || `<p class="hint">No files match this filter.</p>`}
    </div>
    <p class="hint">Source links point back to “Open” cells in the original sheet — the export didn’t carry the underlying URLs, so open the master tracker to follow a specific link.</p>
  `;

  document.getElementById("searchInput").addEventListener("input", e=>{
    st.search = e.target.value;
    renderPanels();
    document.getElementById("searchInput").focus();
    const val = document.getElementById("searchInput").value;
    document.getElementById("searchInput").setSelectionRange(val.length, val.length);
  });
  document.getElementById("chipGroup").querySelectorAll(".chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      st.status = btn.dataset.status;
      renderPanels();
    });
  });
}

let lbSort = "composite";
function scoreFor(sortKey, row){
  if(sortKey==="composite") return row.composite;
  if(sortKey==="conv") return row.conv;
  if(sortKey==="calls") return row.calls;
  if(sortKey==="csat") return row.csat;
}
function leaderboardPanelHTML(){
  return `
    <div class="lb-head">
      <div>
        <div class="section-head"><span class="badge-tag">Q2</span><h2>Top Support Agents — Q2 2026 (Apr–Jun)</h2></div>
        <p class="section-desc" style="margin-top:6px;">Composite score blends conversations replied to, calls answered, and CSAT — each normalized 0–100 across the 16-agent team, then averaged equally.</p>
      </div>
      <div class="sort-group">
        Sort by
        <select id="sortSelect">
          <option value="composite" ${lbSort==='composite'?'selected':''}>Composite score</option>
          <option value="conv" ${lbSort==='conv'?'selected':''}>Conversations</option>
          <option value="calls" ${lbSort==='calls'?'selected':''}>Calls answered</option>
          <option value="csat" ${lbSort==='csat'?'selected':''}>CSAT %</option>
        </select>
      </div>
    </div>
    <div id="lbHost"></div>
    <p class="methodology">Composite score = equal-weighted average (⅓ each) of Conversations Replied To, Calls Answered, and CSAT, each min–max normalized 0–100 across the 16 agents. Source: “Q2 raw data” sheet (Intercom + 3CX exports). Click a row to see the underlying numbers.</p>
  `;
}
function wireLeaderboard(){
  document.getElementById("sortSelect").addEventListener("change", e=>{
    lbSort = e.target.value;
    renderLeaderboardRows();
  });
  renderLeaderboardRows();
}
function renderLeaderboardRows(){
  const maxVal = Math.max(...LEADERBOARD.map(r=>scoreFor(lbSort,r)));
  const sorted = [...LEADERBOARD].sort((a,b)=>scoreFor(lbSort,b)-scoreFor(lbSort,a));
  const host = document.getElementById("lbHost");
  host.innerHTML = "";
  sorted.forEach((r, idx)=>{
    const pct = (scoreFor(lbSort,r)/maxVal*100).toFixed(1);
    const display = lbSort==="csat" ? r.csat.toFixed(1)+"%" :
                     lbSort==="composite" ? r.composite.toFixed(2) :
                     scoreFor(lbSort,r);
    const row = document.createElement("div");
    row.className = "lb-row" + (idx<3?" top":"");
    row.innerHTML = `
      <div class="lb-rank ${idx<3?'g':''}">${idx+1}</div>
      <div class="lb-name">${r.name}</div>
      <div class="lb-bar-track"><div class="lb-bar-fill" style="width:${pct}%"></div></div>
      <div class="lb-score">${display}</div>
    `;
    const detail = document.createElement("div");
    detail.className = "lb-detail";
    detail.innerHTML = `
      <div class="metric">Conversations: <b>${r.conv}</b> (score ${r.convS})</div>
      <div class="metric">Calls answered: <b>${r.calls}</b> (score ${r.callsS})</div>
      <div class="metric">CSAT: <b>${r.csat.toFixed(1)}%</b> (score ${r.csatS})</div>
      <div class="metric">Composite: <b>${r.composite.toFixed(2)}</b></div>
    `;
    row.addEventListener("click", ()=> detail.classList.toggle("open"));
    host.appendChild(row);
    host.appendChild(detail);
  });
}

renderHeroStats();
renderTabs();
renderPanels();
</script>
